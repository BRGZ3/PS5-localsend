# PS5 LocalSend configuration
# Install as /data/ps5localsend/config.ini on the PS5. If it is missing, the
# ELF creates this file automatically with the same defaults.
# Web interface and API port. The fast upload listener normally uses the next
# port (53318), or selects a free port automatically and advertises it.
port=53317
auth_mode=pin
language=en
# Russian interface:
# language=ru
# PIN pairing can be disabled for a trusted LAN. This cannot be changed from
# the web interface:
# auth_mode=none
pin_ttl_seconds=120
session_ttl_seconds=900
# Active destination. The browser dropdown updates only this line:
destination=/data/ps5localsend/inbox
# Format: storage_path=unique_id|Browser label|Absolute path
# Up to 8 entries are supported. The directory is created when selected.
storage_path=internal|Internal storage|/data/ps5localsend/inbox
storage_path=usb|USB drive|/mnt/usb0/ps5localsend/inbox
# Additional examples (confirm the actual mount point on your system):
# storage_path=m2|M.2 SSD|/mnt/ext0/game-images
# storage_path=games|Game images|/data/games/images
max_file_bytes=21474836480
max_files_per_session=100
